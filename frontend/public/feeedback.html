<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CookSmart - Feedback</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login-modal.css">
<script src="script.js" defer></script>
<script src="api-config.js" defer></script>
<script src="login-modal.js" defer></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
line-height:1.6;
color:#333;
background-image: linear-gradient(rgba(255,250,240,0.85), rgba(243,248,255,0.85)), url('https://static.vecteezy.com/system/resources/previews/008/660/558/non_2x/organic-food-background-hand-drawn-concept-free-vector.jpg');
background-size:cover;
background-position:center;
background-attachment:fixed;
min-height:100vh;
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  z-index: 1001;
}

.hamburger span {
  display: block;
  width: 25px;
  height: 3px;
  background: #764ba2;
  border-radius: 3px;
  transition: all 0.3s ease;
}

.hamburger.open span:nth-child(1) {
  transform: rotate(45deg) translate(5px, 6px);
}
.hamburger.open span:nth-child(2) {
  opacity: 0;
}
.hamburger.open span:nth-child(3) {
  transform: rotate(-45deg) translate(5px, -6px);
}

.placeholder-section{
max-width:800px;
margin:6rem auto;
padding:3rem 2rem;
text-align:center;
color:#333;
}

.placeholder-section h1{
font-size:2.2rem;
margin-bottom:1rem;
color:#764ba2;
}

.placeholder-section p{
font-size:1.1rem;
color:#666;
}

.footer{
text-align:center;
padding:20px;
background:white;
color:black;
margin-top:40px;
}

@media (max-width: 768px) {
  .hamburger {
    display: flex;
  }

  .navbar-menu {
    display: none;
    flex-direction: column;
    position: absolute;
    top: 70px;
    left: 0;
    right: 0;
    background: white;
    padding: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    z-index: 1000;
    gap: 8px;
  }

  .navbar-menu.open {
    display: flex;
  }

  .navbar-menu li {
    width: 100%;
    text-align: center;
  }

  .navbar-menu li a {
    display: block;
    padding: 12px;
    border-radius: 8px;
    font-size: 1rem;
    color: #333;
    transition: background 0.2s;
  }

  .navbar-menu li a:hover {
    background: #f3f0fa;
    color: #764ba2;
  }

  .navbar {
    position: relative;
  }

  .placeholder-section{
    margin:3rem 1rem;
    padding:2rem 1.5rem;
  }

  .placeholder-section h1{
    font-size:1.6rem;
  }
}
</style>
</head>

<body>

<nav class="navbar">
<div class="navbar-container">
  <a href="index.html" class="navbar-brand">
    <img src="images/logo.jpg" alt="Logo" style="height:60px; width:200px; border-radius:8%; margin-right:0.5rem; object-fit:cover; vertical-align:middle;">
  </a>

  <button class="hamburger" id="hamburger" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <ul class="navbar-menu" id="navbar-menu">
    <li><a href="index.html">Home</a></li>
    <li><a href="discover.html" onclick="return LoginModal.requireLogin(event)">Discover</a></li>
    <li><a href="trending.html" onclick="return LoginModal.requireLogin(event)">Trending</a></li>
    <li><a href="about.html" onclick="return LoginModal.requireLogin(event)">About</a></li>
  </ul>
</div>
</nav>

<!-- Placeholder content: feedback form will be added here later -->
<section class="placeholder-section">
<h1>Feedback</h1>
<p>This page is coming soon. Share your thoughts and ratings with us here.</p>
</section>

<footer class="footer">
<p>&copy; 2026 CookSmart. Made with ❤️ by Team CookSmart</p>
</footer>

<script>
function toggleMenu() {
  const menu = document.getElementById('navbar-menu');
  const hamburger = document.getElementById('hamburger');
  menu.classList.toggle('open');
  hamburger.classList.toggle('open');
}

document.addEventListener('click', function(e) {
  const menu = document.getElementById('navbar-menu');
  const hamburger = document.getElementById('hamburger');
  if (!menu.contains(e.target) && !hamburger.contains(e.target)) {
    menu.classList.remove('open');
    hamburger.classList.remove('open');
  }
});

document.querySelectorAll('.navbar-menu a').forEach(link => {
  link.addEventListener('click', () => {
    document.getElementById('navbar-menu').classList.remove('open');
    document.getElementById('hamburger').classList.remove('open');
  });
});
</script>

</body>
</html>
